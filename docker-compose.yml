version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: personalai_db
    environment:
      POSTGRES_DB: personalai
      POSTGRES_USER: personalai
      POSTGRES_PASSWORD: personalai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - personalai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalai -d personalai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: personalai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - personalai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: personalai_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - personalai-network
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: personalai_backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - personalai-network

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: personalai_worker
    command: celery -A backend.workers.celery_app worker --loglevel=info -n nova_worker@%h -Q interactive,agent_tasks,document_processing,memory_processing,scheduled
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    networks:
      - personalai-network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: personalai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - personalai-network

volumes:
  db_data:
  redis_data:
  ollama_data:

networks:
  personalai-network:
    driver: bridge
